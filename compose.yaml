name: welcome-demo
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: welcome-demo-api
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
