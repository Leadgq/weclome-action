server {
    listen 80;
    server_name 8.153.182.126;
    root /opt/welcome-demo/current-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
